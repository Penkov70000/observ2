# куда отправлять
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Метрики → Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      source: "otel-collector"

  # Трассировки → Jaeger (через OTLP/gRPC)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Отладка (временно!)
  debug:
    verbosity: basic

  # Логи → Loki (только если у вас есть логи!)
  # otlphttp/loki:
  #   endpoint: "http://loki:3100/otlp"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]  # debug можно убрать в продакшене

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]    # debug — временно

    # logs:  # раскомментируйте, когда добавите логирование в приложения
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [otlphttp/loki]


