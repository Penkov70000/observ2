server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Сбор логов из Docker-контейнеров
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]  # ← Добавьте в docker-compose метку, чтобы фильтровать

    # Добавляем лейблы из Docker-контейнера
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
        replacement: '$1'
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'job'  # Имя сервиса из docker-compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'

    # Парсинг JSON-логов из Docker
    pipeline_stages:
      - match:
          selector: '{job=~"auth-service|order-service|gateway"}'
          stages:
            - json:
                expressions:
                  output: log  # Извлекаем само сообщение
                  level: level
                  timestamp: timestamp
            - labels:
                level:
            - timestamp:
                source: timestamp
                format: RFC3339Nano  # или ISO8601
            - output:
                source: output