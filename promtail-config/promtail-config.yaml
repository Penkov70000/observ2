server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
  # Сбор логов с Docker контейнеров
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlpgs
          __path__: /var/lib/docker/containers/*/*log
  - job_name: auth-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-service
          service: auth
          __path__: /var/lib/docker/containers/*/*-json.log
  
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag: tag
          source: attrs
      - regex:
          expression: '.*service.name":"auth-service".*'
          source: tag
      - labels:
          service: 
      - output:
          source: output

  - job_name: gateway-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: gateway-service
          service: gateway
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag: tag
          source: attrs
      - regex:
          expression: '.*service.name":"gateway".*'
          source: tag
      - labels:
          service: 
      - output:
          source: output

  - job_name: order-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: order-service
          service: order
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag: tag
          source: attrs
      - regex:
          expression: '.*service.name":"order-service".*'
          source: tag
      - labels:
          service: 
      - output:
          source: output